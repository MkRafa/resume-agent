<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}resume-agent{% endblock %}</title>
<style>
/* ── Design tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:        #fcfcfb;
  --surface:   #ffffff;
  --surface-2: #f6f6f4;
  --ink:       #14161a;
  --ink-2:     #4a4f57;
  --ink-3:     #868c95;
  --line:      #e6e6e2;
  --line-2:    #d3d3ce;

  --accent:    #1f6f5c;
  --accent-2:  #e7f2ee;
  --accent-ink:#ffffff;

  --pos:   #157347;  --pos-bg:  #e6f4ec;  --pos-line: #b4dcc6;
  --warn:  #8a5a00;  --warn-bg: #fdf1dd;  --warn-line:#eccf9a;
  --neg:   #a3271f;  --neg-bg:  #fceceb;  --neg-line: #edb9b5;
  --info:  #1f5691;  --info-bg: #e8f0fa;  --info-line:#b8d0ea;

  --r-sm: 6px; --r: 10px; --r-lg: 16px; --r-full: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  --shadow-1: 0 1px 2px rgba(16,18,22,.05), 0 1px 3px rgba(16,18,22,.04);
  --shadow-2: 0 2px 4px rgba(16,18,22,.05), 0 8px 24px rgba(16,18,22,.07);

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter",
          "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0f1114;
    --surface:   #16191e;
    --surface-2: #1c2027;
    --ink:       #e9eaec;
    --ink-2:     #a8aeb8;
    --ink-3:     #737a85;
    --line:      #262b33;
    --line-2:    #333944;

    --accent:    #4fb99b;
    --accent-2:  #14312a;
    --accent-ink:#08120f;

    --pos:  #5cc78d;  --pos-bg:  #12291d;  --pos-line: #1f4a33;
    --warn: #e0ad5c;  --warn-bg: #2c2413;  --warn-line:#4d3f1e;
    --neg:  #ef8880;  --neg-bg:  #2c1a19;  --neg-line: #4f2b28;
    --info: #79aae4;  --info-bg: #16232f;  --info-line:#25405c;

    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.6; letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Chrome ────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 var(--sp-5);
  height: 56px; display: flex; align-items: center; gap: var(--sp-5);
}
.brand {
  font-weight: 640; font-size: 15px; letter-spacing: -0.02em;
  color: var(--ink); display: flex; align-items: center; gap: var(--sp-2);
}
.brand:hover { text-decoration: none; }
.brand-mark {
  width: 22px; height: 22px; border-radius: var(--r-sm);
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
}
.topbar nav { margin-left: auto; display: flex; gap: var(--sp-4); }
.topbar nav a { color: var(--ink-3); font-size: 14px; font-weight: 500; }
.topbar nav a:hover { color: var(--ink); text-decoration: none; }

main { max-width: 1080px; margin: 0 auto; padding: var(--sp-6) var(--sp-5) var(--sp-7); }

/* ── Type ──────────────────────────────────────────────────────────────── */
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.028em;
     font-weight: 650; margin: 0 0 var(--sp-2); }
h2 { font-size: 12px; font-weight: 640; letter-spacing: 0.07em;
     text-transform: uppercase; color: var(--ink-3);
     margin: var(--sp-6) 0 var(--sp-3); }
h3 { font-size: 16px; font-weight: 620; letter-spacing: -0.015em; margin: 0 0 var(--sp-2); }
.lede { color: var(--ink-2); font-size: 15.5px; margin: 0 0 var(--sp-5); max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny  { font-size: 12px; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-2);
       border: 1px solid var(--line); border-radius: var(--r-sm);
       padding: 1px 5px; color: var(--ink-2); }

/* ── Surfaces ──────────────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5); box-shadow: var(--shadow-1);
}
.card + .card { margin-top: var(--sp-4); }
.card-flush { padding: 0; overflow: hidden; }
.card-head {
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
}

/* ── Forms ─────────────────────────────────────────────────────────────── */
label { display: block; font-weight: 580; font-size: 13px; margin-bottom: var(--sp-2); }
textarea, input[type=text], input[type=email] {
  width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line-2); border-radius: var(--r);
  transition: border-color .15s, box-shadow .15s;
}
textarea::placeholder, input::placeholder { color: var(--ink-3); }
textarea:focus, input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
textarea { min-height: 190px; resize: vertical; font-size: 13.5px; line-height: 1.55; }

.filedrop {
  margin-top: var(--sp-3); border: 1px dashed var(--line-2); border-radius: var(--r);
  padding: var(--sp-3) var(--sp-4); background: var(--surface-2);
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  transition: border-color .15s, background .15s;
}
.filedrop:hover { border-color: var(--accent); }
.filedrop input[type=file] { font-size: 12.5px; color: var(--ink-3); max-width: 100%; }

button, .btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  background: var(--accent); color: var(--accent-ink); border: 1px solid transparent;
  border-radius: var(--r); padding: 10px 18px; font: inherit; font-size: 14px;
  font-weight: 580; cursor: pointer; transition: filter .15s, transform .05s;
}
button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
button:active { transform: translateY(1px); }
button.secondary, .btn.secondary {
  background: var(--surface); color: var(--ink); border-color: var(--line-2);
}
button.secondary:hover { background: var(--surface-2); filter: none; }

/* ── Grid ──────────────────────────────────────────────────────────────── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.row { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }

/* ── Tables ────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
  text-align: left; font-size: 11px; font-weight: 620; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  padding: var(--sp-3) var(--sp-4); background: var(--surface-2);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
     vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }

/* ── Chips ─────────────────────────────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: var(--r-full);
  font-size: 11.5px; font-weight: 620; letter-spacing: -.005em;
  border: 1px solid transparent; white-space: nowrap;
}
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%;
                background: currentColor; flex: none; }
.chip-plain::before { display: none; }
.g-direct       { background: var(--pos-bg);  color: var(--pos);  border-color: var(--pos-line); }
.g-adjacent     { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.g-transferable { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.g-none         { background: var(--neg-bg);  color: var(--neg);  border-color: var(--neg-line); }
.g-unknown      { background: var(--info-bg); color: var(--info); border-color: var(--info-line); }
.kind {
  font-size: 10.5px; font-weight: 640; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3);
}
.kind-gate { color: var(--neg); }

/* ── Verdict ───────────────────────────────────────────────────────────── */
.verdict {
  border-radius: var(--r-lg); padding: var(--sp-5); border: 1px solid;
  display: flex; gap: var(--sp-5); align-items: center; flex-wrap: wrap;
}
.verdict-strong_match  { background: var(--pos-bg);  border-color: var(--pos-line); }
.verdict-partial_match { background: var(--warn-bg); border-color: var(--warn-line); }
.verdict-not_matching  { background: var(--neg-bg);  border-color: var(--neg-line); }
.verdict-label { font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.verdict-strong_match  .verdict-label { color: var(--pos); }
.verdict-partial_match .verdict-label { color: var(--warn); }
.verdict-not_matching  .verdict-label { color: var(--neg); }
.verdict-body { flex: 1 1 320px; min-width: 0; }
.verdict-body ul { margin: var(--sp-2) 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.verdict-body li { margin-bottom: 3px; }

.meter { flex: none; text-align: center; min-width: 104px; }
.meter-val { font-size: 30px; font-weight: 660; letter-spacing: -.03em; line-height: 1.1; }
.meter-bar { height: 5px; border-radius: var(--r-full); background: color-mix(in srgb, var(--ink) 12%, transparent);
             overflow: hidden; margin-top: var(--sp-2); }
.meter-fill { height: 100%; border-radius: var(--r-full); background: currentColor; }
.meter-cap { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--ink-3); margin-top: 5px; }

/* ── Stepper ───────────────────────────────────────────────────────────── */
.stepper { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4); }
.step {
  display: flex; align-items: center; gap: 7px; font-size: 12.5px;
  color: var(--ink-3); padding: 5px 11px; border-radius: var(--r-full);
  border: 1px solid var(--line); background: var(--surface);
}
.step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex: none; }
.step.done { color: var(--ink-2); }
.step.done .step-dot { background: var(--pos); }
.step.active {
  color: var(--accent); border-color: var(--accent);
  background: var(--accent-2); font-weight: 580;
}
.step.active .step-dot { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); }
                   50% { opacity: .45; transform: scale(.75); } }

.spinner {
  width: 15px; height: 15px; border: 2px solid var(--line-2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Banners ───────────────────────────────────────────────────────────── */
.banner { padding: var(--sp-4); border-radius: var(--r); border: 1px solid;
          font-size: 14px; margin-bottom: var(--sp-4); }
.banner-error { background: var(--neg-bg);  border-color: var(--neg-line);  color: var(--neg); }
.banner-info  { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }
.banner strong { font-weight: 640; }
.banner ul { margin: var(--sp-2) 0 0; padding-left: 18px; }

/* ── Review flags ──────────────────────────────────────────────────────── */
.flag {
  border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r);
  padding: var(--sp-4); margin-bottom: var(--sp-3); background: var(--surface);
  transition: border-color .15s, background .15s;
}
.flag-blocker { border-left-color: var(--neg); }
.flag-warning { border-left-color: var(--warn); }
.flag:has(input:checked) { background: var(--pos-bg); border-left-color: var(--pos); }
.flag label { display: flex; gap: var(--sp-3); align-items: flex-start;
              cursor: pointer; font-weight: 400; margin: 0; font-size: 14px; }
.flag input[type=checkbox] { margin-top: 4px; width: 15px; height: 15px;
                             accent-color: var(--accent); flex: none; cursor: pointer; }
.flag-claim { font-weight: 600; }

/* ── Misc ──────────────────────────────────────────────────────────────── */
.empty { text-align: center; padding: var(--sp-7) var(--sp-5); color: var(--ink-3); }
.stat-row { display: flex; gap: var(--sp-5); flex-wrap: wrap; color: var(--ink-3);
            font-size: 13px; margin-bottom: var(--sp-5); }
.stat b { color: var(--ink); font-weight: 620; }
ul.clean { margin: var(--sp-2) 0; padding-left: 18px; }
ul.clean li { margin-bottom: 4px; }
details summary { cursor: pointer; user-select: none; }
iframe.preview { width: 100%; height: 660px; border: 1px solid var(--line);
                 border-radius: var(--r); background: #fff; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">R</span> resume-agent</a>
    <nav><a href="/">New match</a></nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
